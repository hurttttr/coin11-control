services:
  server:
    # 直接拉取 GHCR 公开镜像；升级：docker compose pull && docker compose up -d
    # 固定版本可把 latest 换成具体 tag（如 0.4.0）；本地构建改回 build: { context: ., dockerfile: Dockerfile }
    image: ghcr.io/hurttttr/coin11-control:latest
    container_name: coin11-control
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ADB_PATH=adb
      # 容器内只能走 WiFi ADB（无法透传 USB 设备）；ADB_PATH=adb 即可
      # Docker 部署必配：容器内只能探测到虚拟网桥网段，无法得知宿主机局域网，
      # 显式指定后前端连接/配对输入框会自动预填正确网段
      # - LAN_SUBNET_OVERRIDE=192.168.31
      # WS token 已在镜像构建期同时注入前端 bundle 与后端（默认 coin11-control-token）。
      # 运行期覆盖会使前端 bundle 旧值失配（WS 全部 403）；需改 token 时应
      # 用 --build-arg WS_AUTH_TOKEN=<新值> 重建镜像，并同步设置此变量。
      # - WS_AUTH_TOKEN=coin11-control-token
      # - CORS_ORIGINS=["http://localhost:6173","http://127.0.0.1:6173"]
    volumes:
      # 持久化：coin11_tb 克隆 + 自动任务配置等运行时数据，重建容器不丢失
      - coin11-data:/app/data
      # 持久化 ADB 身份（adbkey）—— 重建容器不丢；如需与宿主机同身份（手机已授权过
      # 宿主机 adb 的设备免重新授权），把宿主机 ~/.android/adbkey(.pub) 拷入该卷并
      # chown app:app、chmod 600 adbkey
      - adb-identity:/home/app/.android
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  coin11-data:
  adb-identity:
