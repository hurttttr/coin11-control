name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端测试 ----------
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 的基础镜像保持一致（python:3.12-slim）
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  # ---------- 前端测试 ----------
  # 前端源码位于仓库内 frontend/（monorepo），每次 push 运行完整检查链。
  # 注意：GitHub 表达式不允许在 job 级 if 中使用 hashFiles（仅 step 级可用），
  # 之前的文件存在性守卫会导致整个 workflow 加载失败（0 job 启动失败）。
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        # vue-tsc + vite build（__tests__ 类型错误已修复，恢复完整检查链）
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

  # ---------- 静态检查（后端，硬闸门） ----------
  # ruff/mypy 存量问题已于 2026-10 清零，本 job 为阻塞闸门：
  # 任何新增违规都会直接置红 CI，禁止再以 continue-on-error 放行。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # mypy 需要解析 fastapi/pydantic 等第三方类型，必须安装运行时依赖，
      # 否则全部报 import-not-found（仅装 ruff/mypy 的旧写法只靠基线模式掩盖）。
      - name: Install dependencies (runtime + ruff/mypy pinned in requirements-dev)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check . --output-format=github

      - name: mypy check
        run: mypy app
